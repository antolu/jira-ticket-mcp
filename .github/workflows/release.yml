name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag as PEP 440-compatible semver
        if: github.event_name == 'push'
        run: |
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          VERSION_TAG="${RAW_TAG#v}"
          export VERSION_TAG
          python - <<'PY'
          from __future__ import annotations

          import os
          import sys

          from packaging.version import InvalidVersion, Version

          version_tag = os.environ["VERSION_TAG"]
          try:
              Version(version_tag)
          except InvalidVersion:
              print(f"Invalid PEP 440 version tag: {version_tag}")
              print("Use tags like v1.2.3, v1.2.3rc1, or v1.2.3.dev1")
              sys.exit(1)
          PY

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  test-wheel:
    name: Test wheel (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install the built wheel with its test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install "$(ls dist/*.whl)[test]"

      # Run from outside the repo so `import jira_ticket_mcp` resolves to the
      # installed wheel rather than the source tree sitting in the checkout.
      # pyproject.toml travels along because it carries the pytest config.
      - name: Stage the suite outside the source tree
        run: |
          mkdir -p "${RUNNER_TEMP}/wheel-test"
          cp -r tests "${RUNNER_TEMP}/wheel-test/"
          cp pyproject.toml "${RUNNER_TEMP}/wheel-test/"

      - name: Confirm the wheel is what is under test
        working-directory: ${{ runner.temp }}/wheel-test
        run: |
          python -c "
          import jira_ticket_mcp
          path = jira_ticket_mcp.__file__
          assert 'site-packages' in path, f'testing the source tree, not the wheel: {path}'
          print(path)
          "

      - name: Run the suite against the installed wheel
        working-directory: ${{ runner.temp }}/wheel-test
        run: python -m pytest tests -q

      - name: Verify the console entry point
        run: jira-ticket-mcp --help

  test-uvx:
    name: Test uvx invocation
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Proves the wheel's dependencies resolve in a clean environment and the
      # console script runs, which is how end users will invoke this.
      - name: Run the wheel through uvx
        run: uvx --from "$(ls dist/*.whl)" jira-ticket-mcp --help

  publish:
    name: Publish to PyPI
    needs: [test-wheel, test-uvx]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jira-ticket-mcp
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Create GitHub release
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes grouped by commit type
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag --sort=-v:refname | awk -v cur="$CURRENT_TAG" 'found{print; exit} $0==cur{found=1}')
          RANGE="${PREV_TAG:+${PREV_TAG}..}${CURRENT_TAG}"

          declare -A TITLES=(
            [feat]="Features" [fix]="Fixes" [perf]="Performance"
            [refactor]="Refactoring" [docs]="Documentation" [test]="Tests"
            [build]="Build" [ci]="CI" [chore]="Chores" [revert]="Reverts"
          )
          ORDER=(feat fix perf refactor docs test build ci chore revert)
          TYPE_PATTERN=$(IFS='|'; echo "${ORDER[*]}")

          NOTES_FILE=$(mktemp)
          for type in "${ORDER[@]}"; do
            entries=$(git log "$RANGE" --pretty=%s | grep -E "^${type}(\(.+\))?!?: " || true)
            if [ -n "$entries" ]; then
              {
                echo "## ${TITLES[$type]}"
                echo "$entries" | sed -E "s/^${type}(\(.+\))?!?: /* /"
                echo
              } >> "$NOTES_FILE"
            fi
          done

          OTHER=$(git log "$RANGE" --pretty=%s | grep -vE "^(${TYPE_PATTERN})(\(.+\))?!?: " || true)
          if [ -n "$OTHER" ]; then
            {
              echo "## Other"
              echo "$OTHER" | sed -E 's/^/* /'
            } >> "$NOTES_FILE"
          fi

          echo "NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$CURRENT_TAG" --title "$CURRENT_TAG" --notes-file "$NOTES_FILE"
